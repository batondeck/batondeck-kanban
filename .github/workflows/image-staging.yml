# image-staging: builds the image from a commit on main and pushes it as
# ghcr.io/batondeck/batondeck-kanban:staging, for linux/amd64 and linux/arm64. It cuts no release
# and touches no version tag: the binary inside reports <version>-staging+<short sha>, the version
# being plugin.json's (which release-check holds equal to compose.yaml's). On demand only
# (workflow_dispatch), with the candidate's full SHA; it refuses a candidate that is not on main.
#
# WHY. The owner's 2026-11-04 ruling: "ship on prod and staging", where staging is this image and
# prod is the release (release-draft, then release-publish), both run by CI.
name: image-staging

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Full SHA of the commit to build (must be on main)
        required: true

# Read-only by default; the one job holds packages: write itself (its actions are named by commit SHA).
permissions:
  contents: read

# One staging build at a time: two runs would race on the :staging tag.
concurrency:
  group: image-staging
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  staging:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      CANDIDATE: ${{ inputs.candidate }}
      IMAGE: ghcr.io/batondeck/batondeck-kanban
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 0

      - name: The candidate is on main and is a full SHA
        run: |
          case "$CANDIDATE" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
            *) echo "candidate must be a full SHA"; exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$CANDIDATE" origin/main || { echo "candidate is not on main"; exit 1; }

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push :staging for linux/amd64 and linux/arm64
        run: |
          version="$(jq -r .version plugin/.claude-plugin/plugin.json)-staging+${CANDIDATE:0:12}"
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$version" -t "$IMAGE:staging" --push .
          docker buildx imagetools inspect "$IMAGE:staging" | tee image-inspect.txt
          grep -q 'linux/amd64' image-inspect.txt
          grep -q 'linux/arm64' image-inspect.txt
          echo "version=$version" >> "$GITHUB_ENV"

      - name: The pushed image runs and reports its version
        run: |
          docker run --rm --platform linux/amd64 "$IMAGE:staging" version | tee version.txt
          grep -qF "$version" version.txt
