# ci: the gate on every pull request and on every push to main. It runs `make check`, the same target
# the pre-push hook runs (githooks/pre-push), once, with a Postgres 16 service and
# BATONDECK_TEST_POSTGRES_DSN pointing at it, so the Postgres halves of conformance, perf and the
# live contract run rather than skip. The SPA's typecheck and vitest suite are part of `make check`
# (its web-check step), so the hook and this workflow cannot run different gates. Before it, this
# workflow alone runs govulncheck and npm audit: both ask an advisory database over the network,
# which the hook does not need.
#
# The service is the hook's: the postgres:16-alpine image, user and password batondeck, the
# `postgres` database (each test makes its own). GOWORK=off as in the hook: the gate proves the
# committed go.mod and go.sum.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    # The slowest runs so far took 49 to 52 minutes, nearly all of it `make check`; 90 leaves room
    # for a slower runner, and a hung test meets Go's own -timeout (TEST_TIMEOUT below, which names
    # the test) well before the job limit (which names nothing). make prints each step's command as
    # it starts it, so a job stopped at the limit still shows which step it was in.
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: batondeck
          POSTGRES_PASSWORD: batondeck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U batondeck -h 127.0.0.1"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      GOWORK: "off"
      BATONDECK_TEST_POSTGRES_DSN: postgres://batondeck:batondeck@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: govulncheck
        # A vulnerability the code reaches, in the standard library of the Go go.mod pins or in a
        # module, fails the gate (exit 3); one it does not call is listed and passes. Installed and
        # then run, not `go run`: under `go run` it would scan the Go that runs it, which can be newer
        # than the pinned one.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: npm audit
        # An advisory of moderate or worse in what the web UI is built from (its dependencies) fails
        # the gate; one in the dev tooling (vite, vitest, jsdom) is shown as a warning.
        working-directory: web
        run: |
          npm audit --package-lock-only --omit=dev --audit-level=moderate
          npm audit --package-lock-only || echo "::warning title=npm audit::a dev dependency of web/ has a published advisory (see above)"

      - name: make check, both engines
        # The runner has 2 vCPUs: internal/cli under -race outruns the Makefile's 20m test timeout here.
        run: make check TEST_TIMEOUT=40m
