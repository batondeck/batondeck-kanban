# release-draft: the Z-03 sequence of RELEASING.md run by GitHub Actions on demand, ending in a DRAFT
# release that a maintainer publishes (publishing creates the tag at the candidate).
#
# WHY A WORKFLOW WHEN RELEASING.md SAYS RELEASES ARE CUT LOCALLY. The owner's 2026-10-29 ruling: the
# cloud session that drove v0.1.0 to its candidate cannot push a tag, create a release or log in to
# ghcr (its GitHub proxy refuses all three), and the owner wants a draft to publish rather than the
# local sequence. This file does what RELEASING.md steps 1, 4, 5 and 6 do, with the GITHUB_TOKEN:
# the version check, a local annotated tag (step 3's tag, made in the runner only) so `make dist`,
# `make sbom` and `make image` accept the tree, two independent dist builds compared, the SBOM, the
# multi-arch image pushed to ghcr (optional), and `gh release create --draft`. Nothing here is
# pushed to the repository: the real tag appears when the draft is published, at the same commit
# the local tag named, so the binaries' stamped vcs.revision is the tag's commit.
#
# What it does NOT do: step 2 (`make bench`, which compares nothing off the baseline machine), the
# gate (step 3's pre-push `make check` on both engines: the candidate must be a commit whose tree
# the gate has passed, which every commit on main is, since main lands through gated pushes), step
# 5's `docker run … version` smoke, and the publish itself. Run it with the candidate's full SHA;
# it refuses a candidate that is not on main. With `replace`, an existing v<version> release and its
# tag are deleted just before the draft is created, so a published version can be re-cut from a later
# commit; release-publish then creates the tag again at the new candidate.
#
# THREE JOBS, AND ONLY TWO WRITE. `build` (steps 1 and 4 and the notes) runs under a read-only token;
# `image` (step 5) alone holds packages: write, and `release` (step 6, and `replace`) alone holds
# contents: write. Every action is named by its commit SHA (the tag in the comment beside it), so a
# tag moved on an action's repository runs nothing here, and nothing in the build holds a token that
# can push the image or touch a release. The image runs after the build and the release after both, so
# a failed build pushes no image and a failed image creates no draft.
name: release-draft

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Full SHA of the commit to release (must be on main)
        required: true
      version:
        description: Version to release (compose.yaml, plugin.json and CHANGELOG.md must agree)
        required: true
        default: "0.1.0"
      push_image:
        description: Push ghcr.io/batondeck/batondeck-kanban:<version> (and :latest)
        type: boolean
        default: true
      replace:
        description: Delete an existing v<version> release and its tag first, so this draft replaces it
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  VERSION: ${{ inputs.version }}
  CANDIDATE: ${{ inputs.candidate }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 0

      - name: The candidate is on main and is a full SHA
        run: |
          case "$CANDIDATE" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
            *) echo "candidate must be a full SHA"; exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$CANDIDATE" origin/main || { echo "candidate is not on main"; exit 1; }

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Step 1, the versions agree on the candidate
        run: scripts/release-check.sh "$VERSION"

      - name: Local annotated tag, so the tree checks pass (publishing the draft creates the real one here)
        run: |
          git config user.name "release-draft"
          git config user.email "release-draft@users.noreply.github.com"
          # replace: checkout fetched the published tag; this run's local tag names the candidate instead.
          if [ "${{ inputs.replace }}" = true ]; then git tag -d "v$VERSION" 2>/dev/null || true; fi
          git tag -a "v$VERSION" -m "batondeck-kanban $VERSION — CHANGELOG.md has the notes" "$CANDIDATE"
          test "$(git rev-parse "v$VERSION^{commit}")" = "$CANDIDATE"

      - name: Step 4, make dist and make sbom
        run: |
          make dist VERSION="$VERSION"
          make sbom VERSION="$VERSION"

      - name: Step 4, a second independent build reproduces SHA256SUMS
        run: |
          dir2=$(mktemp -d)/batondeck-kanban
          git clone -q . "$dir2"
          git -C "$dir2" checkout -q "$CANDIDATE"
          git -C "$dir2" tag -a "v$VERSION" -m "second build" "$CANDIDATE" 2>/dev/null || true
          make -C "$dir2" dist VERSION="$VERSION"
          diff dist/SHA256SUMS "$dir2/dist/SHA256SUMS" && echo reproduced

      - name: Step 6, the notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 { f = 1; next } /^(## |### )/ { f = 0 } f' CHANGELOG.md > notes.md
          cat notes.md

      # The release job publishes these; they leave this job as an artifact, not with a write token.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ inputs.version }}-${{ inputs.candidate }}
          path: |
            dist/
            notes.md
          if-no-files-found: error

  image:
    needs: build
    if: ${{ inputs.push_image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      # No git command here reaches origin, so the token is not left in .git/config.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 0
          persist-credentials: false

      - name: Local annotated tag, so make image's tree check passes
        run: |
          git config user.name "release-draft"
          git config user.email "release-draft@users.noreply.github.com"
          if [ "${{ inputs.replace }}" = true ]; then git tag -d "v$VERSION" 2>/dev/null || true; fi
          git tag -a "v$VERSION" -m "batondeck-kanban $VERSION — CHANGELOG.md has the notes" "$CANDIDATE"
          test "$(git rev-parse "v$VERSION^{commit}")" = "$CANDIDATE"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Step 5, make image for linux/amd64 and linux/arm64, pushed
        id: push
        run: |
          make image VERSION="$VERSION" PUSH=1
          docker buildx imagetools inspect "ghcr.io/batondeck/batondeck-kanban:$VERSION" | tee image-inspect.txt
          grep -q 'linux/amd64' image-inspect.txt
          grep -q 'linux/arm64' image-inspect.txt
          echo "digest=$(sed -n 's/^Digest: *//p' image-inspect.txt | head -1)" >> "$GITHUB_OUTPUT"

  release:
    needs: [build, image]
    # image is skipped without push_image; then the draft needs the build alone.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.image.result == 'success' || needs.image.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.candidate }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ inputs.version }}-${{ inputs.candidate }}

      - name: Step 6, the image in the notes
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          if [ -n "$DIGEST" ]; then
            printf '\nImage: `ghcr.io/batondeck/batondeck-kanban:%s` (%s), linux/amd64 and linux/arm64.\n' "$VERSION" "$DIGEST" >> notes.md
          else
            printf '\nImage: `ghcr.io/batondeck/batondeck-kanban:%s` for linux/amd64 and linux/arm64, built from this tag with `make image VERSION=%s`.\n' "$VERSION" "$VERSION" >> notes.md
          fi
          cat notes.md

      # replace (owner 2026-10-30: v0.1.0 re-cut from a later main, by CI only). It runs only after the
      # build, the second build and the image have succeeded, so a failed run leaves the old release.
      - name: Replace, when asked, the existing release and its tag
        if: ${{ inputs.replace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,targetCommitish; then
            gh release delete "v$VERSION" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            git push origin ":refs/tags/v$VERSION"
          fi
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then echo "tag v$VERSION still exists"; exit 1; fi

      - name: Step 6, the DRAFT release with its assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft --target "$CANDIDATE" \
            --title "v$VERSION" --notes-file notes.md \
            dist/batondeck-kanban_${VERSION}_* dist/SHA256SUMS dist/sbom.cdx.json THIRD_PARTY_NOTICES
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish,assets --jq '{isDraft, targetCommitish, assets: [.assets[].name]}'
