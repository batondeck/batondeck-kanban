<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - BatonDeck</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f5f3;color:#1c1b1a}
  main{width:360px;max-width:92vw;background:#fff;border:1px solid #e2dfda;border-radius:12px;padding:28px}
  h1{font-size:20px;margin:0 0 6px}
  p{margin:0 0 18px;color:#5b5853;font-size:14px;line-height:1.5}
  label{display:block;font-size:13px;margin:12px 0 4px}
  input{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #cfcac3;border-radius:8px;font-size:14px}
  button{margin-top:18px;width:100%;padding:10px;border:0;border-radius:8px;background:#1c1b1a;color:#fff;font-size:14px;cursor:pointer}
  .error{color:#a2261b;font-size:13px;margin:0 0 12px}
</style>
</head>
<body>
<main>
  <h1>Sign in to BatonDeck</h1>
  <p><strong>{{.Client}}</strong> wants to connect to your board. Sign in first; you choose what it may do next.</p>
  {{if .Failed}}<p class="error">That login and password did not match an account.</p>{{end}}
  {{if .Limited}}<p class="error">Too many sign-in attempts from this address. Wait a minute, then try again.</p>{{end}}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{.Next}}">
    <label for="login">Login</label>
    <input id="login" name="login" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
