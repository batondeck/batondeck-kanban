# batondeck-kanban on Postgres 16. README.md's quickstart says how to run it; in short:
#
#   ( umask 077
#     printf 'BATONDECK_MASTER_KEY=%s\n' "$(openssl rand -base64 32)" > .env
#     printf 'BATONDECK_POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)" >> .env )
#   docker compose up -d --wait
#   curl -fsS http://127.0.0.1:8080/healthz
#
# --wait returns once the board's health check passes: `up -d` alone returns before it listens, and a
# curl right after it gets an empty reply.
#
# `make image` refuses a VERSION this file's image line does not name (scripts/release-check.sh
# compose), so a release bumps the tag here first.
#
# The orchestrator keeps its blobs on the `data` volume, and the SQLite file too when it runs on
# SQLite: set BATONDECK_DATABASE_URL=/data/batondeck-kanban.db (in .env, or in the shell) and start it
# with `docker compose up -d --no-deps batondeck-kanban` (compose still reads the postgres service, so
# .env keeps both lines). The image alone (`docker run`) runs on that SQLite file by default.
#
# The board is published on 127.0.0.1 only. The claude.ai connector needs it at a public HTTPS URL:
# put a TLS reverse proxy in front of 127.0.0.1:8080 and set BATONDECK_PUBLIC_URL to that URL. The
# proxy should forward the original Host and send X-Forwarded-Proto: https and X-Forwarded-For
# (README step 6); an https BATONDECK_PUBLIC_URL makes the sign-in cookies Secure in any case.
services:
  batondeck-kanban:
    image: ghcr.io/batondeck/batondeck-kanban:0.1.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # A postgres:// URL selects Postgres; a file path selects SQLite. `doctor` reports the engine
      # the connection answers as.
      BATONDECK_DATABASE_URL: ${BATONDECK_DATABASE_URL:-postgres://batondeck:${BATONDECK_POSTGRES_PASSWORD:?set BATONDECK_POSTGRES_PASSWORD, for example in .env beside compose.yaml - openssl rand -hex 24 (hex, since it goes into the URL unescaped)}@postgres:5432/batondeck?sslmode=disable}
      BATONDECK_BLOB_DIR: /data/blobs
      # On Postgres there is no master.key file beside a SQLite file, so the key comes from here:
      # without one, attachments and the wake directory's inbox tokens are refused.
      BATONDECK_MASTER_KEY: ${BATONDECK_MASTER_KEY:?set BATONDECK_MASTER_KEY to a base64 32-byte key, for example in .env beside compose.yaml - openssl rand -base64 32}
      # The OAuth issuer, for the claude.ai connector; empty runs with API tokens only. Set, it is also
      # the attachment links' base; empty, each link takes the host the client reached the board at.
      BATONDECK_PUBLIC_URL: ${BATONDECK_PUBLIC_URL:-}
      # The reverse proxy's address as the board sees it (comma-separated IPs or CIDRs), so the
      # sign-in and registration limits count each client by X-Forwarded-For, not everyone as the
      # proxy. Empty, the header is never read. Behind the published port below that address is
      # usually this network's gateway (docker network inspect).
      BATONDECK_TRUSTED_PROXIES: ${BATONDECK_TRUSTED_PROXIES:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - data:/data
    # The image's own check runs every 30 s; this one lets `up --wait` return within seconds of the
    # board listening. The image has no shell, so the test is the binary's own healthcheck.
    healthcheck:
      test: ["CMD", "/batondeck-kanban", "healthcheck"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  postgres:
    # By digest (Postgres 16.15's multi-platform index), so a moved tag cannot change the image that
    # holds the database, and `docker compose pull` fetches this image and no other. A release moves it
    # to a newer 16.x, which starts on the same volume.
    image: postgres:16.15@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
    environment:
      POSTGRES_USER: batondeck
      POSTGRES_PASSWORD: ${BATONDECK_POSTGRES_PASSWORD:?set BATONDECK_POSTGRES_PASSWORD, for example in .env beside compose.yaml - openssl rand -hex 24 (hex, since it goes into the URL unescaped)}
      POSTGRES_DB: batondeck
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U batondeck -d batondeck"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  data:
  pgdata:
